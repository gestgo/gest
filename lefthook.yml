pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: goimports -w {staged_files}
    lint:
      glob: "*.go"
      run: golangci-lint run {staged_files}
    test:
      glob: "*.go"
      run: go test ./...

commit-msg:
  commands:
    commitlint:
      run: commitlint lint -c .commitlint.yaml --msg {1}
